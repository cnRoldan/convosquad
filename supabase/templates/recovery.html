<!doctype html>
<html lang="es">
  <body>
    <h1>Recupera tu acceso a ConvoSquad</h1>
    <p>Has solicitado cambiar tu contraseña.</p>
    <p><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery">Elegir una nueva contraseña</a></p>
    <p>También puedes introducir este código en la pantalla de recuperación:</p>
    <p><strong>{{ .Token }}</strong></p>
    <p>Si no has solicitado este cambio, puedes ignorar este correo.</p>
  </body>
</html>
